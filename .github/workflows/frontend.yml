name: Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/home_maintenance/panel
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: custom_components/home_maintenance/panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # dist ships in the release zip, so it must be rebuilt and committed with the sources
      - name: Check that dist is up to date
        run: git diff --exit-code -- dist
