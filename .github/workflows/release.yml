name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  build:
    name: Build and attach the zip
    needs: [tests, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # The device version and the card's cache-busting URL come from VERSION
      - name: Check that the tag matches the integration version
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' custom_components/home_maintenance/const.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ${version} in const.py"
            exit 1
          fi

      - name: Patch manifest and zip
        run: |
          sed -i "s/v0.0.0/${GITHUB_REF_NAME}/" custom_components/home_maintenance/manifest.json
          cd custom_components/home_maintenance/
          zip ../../home_maintenance.zip ./* translations/* frontend/dist/* -x '.*'

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v3
        with:
          files: home_maintenance.zip
          fail_on_unmatched_files: true
